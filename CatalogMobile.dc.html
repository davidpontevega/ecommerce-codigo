<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .mono { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 11px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
    .card { border-radius: 13px; }
    .chk { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex-shrink: 0; }
    .frow { display: flex; align-items: center; gap: 12px; padding: 12px 0; font-size: 15px; cursor: pointer; border-bottom: 1px solid var(--bd); }
    .stagger { animation: fadeUp .45s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i,0) * 55ms); }
    .sheet { animation: rise .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; background: {{t.page}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; overflow: hidden; position: relative;">

  <!-- HEADER -->
  <header style="position: sticky; top: 0; z-index: 20; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: {{t.headerBg}}; backdrop-filter: blur(8px); border-bottom: 1px solid {{t.border}};">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 11px; border: 1px solid {{t.border}}; background: transparent; cursor: pointer;" aria-label="Volver">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="flex: 1;">
        <h1 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">Laptops</h1>
        <p style="margin: 1px 0 0; font-size: 12px; color: {{t.mutedFg}};"><span class="mono" style="color: {{t.fg}}; font-weight: 600;">{{count}}</span> productos</p>
      </div>
      <a href="#" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 11px; border: 1px solid {{t.border}}; background: transparent;" aria-label="Carrito">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="mono" style="position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 3px; display: grid; place-items: center; font-size: 10px; font-weight: 600; border-radius: 999px; background: {{accent}}; color: #fff;">3</span>
      </a>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 11px; background: {{t.muted}}; border: 1px solid {{t.border}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" placeholder="Busca en el catálogo" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: {{t.fg}}; font-size: 14px; font-family: inherit;">
    </label>
    <div style="display: flex; gap: 8px;">
      <button onClick="{{openSheet}}" class="btn" style="flex: 1; background: {{t.card}}; color: {{t.fg}}; border-color: {{t.border}};">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filtros
        <sc-if value="{{hasChips}}" hint-placeholder-val="{{true}}">
          <span class="mono" style="min-width: 18px; height: 18px; padding: 0 4px; display: grid; place-items: center; font-size: 11px; font-weight: 600; border-radius: 999px; background: {{accent}}; color: #fff;">{{chipCount}}</span>
        </sc-if>
      </button>
      <button class="btn" style="flex: 1; background: {{t.card}}; color: {{t.fg}}; border-color: {{t.border}};">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
        Ordenar
      </button>
    </div>
  </header>

  <!-- CHIPS -->
  <sc-if value="{{hasChips}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
        <button onClick="{{c.remove}}" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.accentSoft}}; color: {{t.fg}}; font-size: 13px; cursor: pointer;">
          {{c.label}}
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <!-- GRID -->
  <section style="padding: 14px 16px 32px;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <sc-for list="{{results}}" as="p" hint-placeholder-count="8">
        <article class="card stagger" style="--i: {{p.i}}; display: flex; flex-direction: column; background: {{t.card}}; border: 1px solid {{t.border}}; overflow: hidden;">
          <div style="position: relative; aspect-ratio: 1 / 1; background: {{t.muted}}; display: grid; place-items: center;">
            <sc-if value="{{p.hasOff}}" hint-placeholder-val="{{true}}">
              <span class="mono" style="position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 600; padding: 3px 6px; border-radius: 6px; background: {{accent}}; color: #fff;">{{p.o}}</span>
            </sc-if>
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;"><rect x="2" y="4" width="20" height="12" rx="2"/><path d="M2 20h20"/></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px; padding: 11px;">
            <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: {{t.mutedFg}};">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="{{accent}}" stroke="none"><path d="M12 2l3 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.9 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
              <span class="mono">{{p.r}}</span>
            </div>
            <h3 style="margin: 0; font-size: 13px; font-weight: 600; line-height: 1.3;">{{p.n}}</h3>
            <div style="display: flex; align-items: baseline; gap: 6px;">
              <span class="mono" style="font-size: 15px; font-weight: 600;">{{p.p}}</span>
              <sc-if value="{{p.hasOff}}" hint-placeholder-val="{{true}}">
                <span class="mono" style="font-size: 12px; color: {{t.mutedFg}}; text-decoration: line-through;">{{p.w}}</span>
              </sc-if>
            </div>
            <button class="btn" style="margin-top: 3px; width: 100%; height: 44px; background: {{t.fg}}; color: {{t.bg}};">Añadir</button>
          </div>
        </article>
      </sc-for>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 48px 0; text-align: center; color: {{t.mutedFg}};">
        <p style="margin: 0 0 12px; font-size: 14px; font-weight: 600; color: {{t.fg}};">Sin resultados con estos filtros</p>
        <button onClick="{{clear}}" class="btn" style="background: {{accent}}; color: #fff;">Limpiar filtros</button>
      </div>
    </sc-if>
  </section>

  <!-- FILTER SHEET -->
  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0.45);" onClick="{{closeSheet}}"></div>
    <div class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 82%; display: flex; flex-direction: column; background: {{t.bg}}; border-radius: 20px 20px 0 0; border-top: 1px solid {{t.border}};">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid {{t.border}};">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filtros
        </span>
        <button onClick="{{closeSheet}}" style="width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; border: 1px solid {{t.border}}; background: transparent; cursor: pointer;" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div style="flex: 1; overflow: auto; padding: 6px 18px 12px;">
        <p style="margin: 14px 0 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: {{t.mutedFg}};">Precio</p>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
          <input type="number" placeholder="Mín" style="flex: 1; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.card}}; color: {{t.fg}}; font-family: inherit; font-size: 14px;">
          <span style="color: {{t.mutedFg}};">—</span>
          <input type="number" placeholder="Máx" style="flex: 1; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.card}}; color: {{t.fg}}; font-family: inherit; font-size: 14px;">
        </div>

        <p style="margin: 20px 0 2px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: {{t.mutedFg}};">Categoría</p>
        <sc-for list="{{catOpts}}" as="o" hint-placeholder-count="4">
          <div class="frow" style="--bd: {{t.border}};" onClick="{{o.toggle}}">
            <span class="chk" style="border: 1.5px solid {{o.bd}}; background: {{o.bg}};">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></sc-if>
            </span>
            <span style="flex: 1;">{{o.label}}</span>
            <span class="mono" style="font-size: 13px; color: {{t.mutedFg}};">{{o.n}}</span>
          </div>
        </sc-for>

        <p style="margin: 20px 0 2px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: {{t.mutedFg}};">Marca</p>
        <sc-for list="{{brandOpts}}" as="o" hint-placeholder-count="4">
          <div class="frow" style="--bd: {{t.border}};" onClick="{{o.toggle}}">
            <span class="chk" style="border: 1.5px solid {{o.bd}}; background: {{o.bg}};">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></sc-if>
            </span>
            <span style="flex: 1;">{{o.label}}</span>
            <span class="mono" style="font-size: 13px; color: {{t.mutedFg}};">{{o.n}}</span>
          </div>
        </sc-for>

        <p style="margin: 20px 0 2px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: {{t.mutedFg}};">Valoración mínima</p>
        <sc-for list="{{ratingOpts}}" as="o" hint-placeholder-count="3">
          <div class="frow" style="--bd: {{t.border}};" onClick="{{o.set}}">
            <span style="width: 18px; height: 18px; border-radius: 999px; border: 1.5px solid {{o.bd}}; display: grid; place-items: center; flex-shrink: 0;">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><span style="width: 9px; height: 9px; border-radius: 999px; background: {{accent}};"></span></sc-if>
            </span>
            <span style="display: flex; align-items: center; gap: 4px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="{{accent}}" stroke="none"><path d="M12 2l3 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.9 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
              {{o.label}}
            </span>
          </div>
        </sc-for>

        <div class="frow" style="--bd: transparent;" onClick="{{toggleStock}}">
          <span style="display: flex; align-items: center; gap: 10px; flex: 1;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 3 4 7v10l8 4 8-4z"/><path d="m4 7 8 4 8-4M12 21V11"/></svg>
            Solo con stock
          </span>
          <span style="width: 42px; height: 24px; border-radius: 999px; background: {{stockBg}}; position: relative;">
            <span style="position: absolute; top: 2px; left: {{stockX}}; width: 20px; height: 20px; border-radius: 999px; background: #fff; transition: left .2s;"></span>
          </span>
        </div>
      </div>
      <div style="display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid {{t.border}};">
        <button onClick="{{clear}}" class="btn" style="flex: 1; background: transparent; color: {{t.fg}}; border-color: {{t.border}};">Limpiar</button>
        <button onClick="{{closeSheet}}" class="btn" style="flex: 2; background: {{accent}}; color: #fff;">Ver {{count}} resultados</button>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"accent":{"editor":"color","default":"#5b5bd6","options":["#5b5bd6","#2563eb","#7c3aed","#be123c"],"section":"Marca"},"$preview":{"width":390,"height":2500}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cats: [], brands: [], minR: 0, stock: false, sheet: false }; }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const accent = this.props.accent ?? '#5b5bd6';
    const light = {
      page: 'linear-gradient(160deg, oklch(0.93 0.022 250) 0%, oklch(0.96 0.008 210) 50%, oklch(0.96 0.025 95) 100%)',
      bg: 'oklch(1 0 0)', fg: 'oklch(0.2 0.02 260)',
      card: 'oklch(1 0 0 / 0.72)', muted: 'oklch(0.97 0.005 250 / 0.6)', mutedFg: 'oklch(0.5 0.02 260)',
      border: 'oklch(0.62 0.02 260 / 0.16)', headerBg: 'oklch(1 0 0 / 0.72)',
      accentSoft: 'color-mix(in srgb, ' + accent + ' 12%, transparent)',
    };
    const darkT = {
      page: 'linear-gradient(160deg, oklch(0.24 0.02 260) 0%, oklch(0.17 0.012 250) 50%, oklch(0.19 0.018 95) 100%)',
      bg: 'oklch(0.145 0 0)', fg: 'oklch(0.97 0 0)',
      card: 'oklch(1 0 0 / 0.06)', muted: 'oklch(1 0 0 / 0.04)', mutedFg: 'oklch(0.72 0.02 260)',
      border: 'oklch(1 0 0 / 0.12)', headerBg: 'oklch(0.16 0.01 260 / 0.8)',
      accentSoft: 'color-mix(in srgb, ' + accent + ' 22%, transparent)',
    };
    const t = dark ? darkT : light;
    const st = this.state || {};
    const cats = st.cats || [];
    const brands = st.brands || [];
    const minR = st.minR || 0;
    const stock = !!st.stock;

    const all = [
      { n: 'UltraBook 14” Air', s: 'Core i5 · 8 GB', p: '$799', w: '$899', o: '-11%', hasOff: true, r: '4.6', cat: 'Ultraligeras', brand: 'Nordic', stk: true },
      { n: 'UltraBook 14” Pro', s: 'Core i7 · 16 GB', p: '$1,099', w: '$1,299', o: '-15%', hasOff: true, r: '4.8', cat: 'Ultraligeras', brand: 'Nordic', stk: true },
      { n: 'Creator 15” Studio', s: 'Ryzen 9 · 32 GB', p: '$1,749', w: '', o: '', hasOff: false, r: '4.9', cat: 'Creadores', brand: 'Kite', stk: true },
      { n: 'Gamer 16” Raptor', s: 'Core i9 · RTX 4070', p: '$1,999', w: '$2,199', o: '-9%', hasOff: true, r: '4.7', cat: 'Gaming', brand: 'Volt', stk: false },
      { n: 'Gamer 15” Pulse', s: 'Ryzen 7 · RTX 4060', p: '$1,349', w: '$1,499', o: '-10%', hasOff: true, r: '4.5', cat: 'Gaming', brand: 'Volt', stk: true },
      { n: 'Business 14” Slate', s: 'Core i5 · 16 GB', p: '$999', w: '', o: '', hasOff: false, r: '4.4', cat: 'Oficina', brand: 'Kite', stk: true },
      { n: 'Business 13” Mini', s: 'Core i3 · 8 GB', p: '$649', w: '$749', o: '-13%', hasOff: true, r: '4.2', cat: 'Oficina', brand: 'Nordic', stk: true },
      { n: 'Creator 14” Air', s: 'Ryzen 7 · 1 TB', p: '$1,299', w: '', o: '', hasOff: false, r: '4.8', cat: 'Creadores', brand: 'Kite', stk: false },
      { n: 'UltraBook 13” Nano', s: 'Core i7 · 16 GB', p: '$1,199', w: '$1,349', o: '-11%', hasOff: true, r: '4.7', cat: 'Ultraligeras', brand: 'Aether', stk: true },
      { n: 'Gamer 17” Titan', s: 'Core i9 · RTX 4080', p: '$2,899', w: '', o: '', hasOff: false, r: '4.9', cat: 'Gaming', brand: 'Volt', stk: true },
      { n: 'Business 15” Plus', s: 'Ryzen 5 · 16 GB', p: '$899', w: '$999', o: '-10%', hasOff: true, r: '4.3', cat: 'Oficina', brand: 'Aether', stk: true },
      { n: 'Creator 16” Max', s: 'Core i9 · RTX 4070', p: '$2,199', w: '$2,399', o: '-8%', hasOff: true, r: '4.8', cat: 'Creadores', brand: 'Aether', stk: true },
    ];

    const num = (s) => Number(String(s).replace(/[^0-9.]/g, ''));
    const filtered = all.filter((p) =>
      (cats.length === 0 || cats.indexOf(p.cat) >= 0) &&
      (brands.length === 0 || brands.indexOf(p.brand) >= 0) &&
      (minR === 0 || num(p.r) >= minR) &&
      (!stock || p.stk)
    );
    const results = filtered.map((p, idx) => ({ ...p, i: idx }));

    const toggleIn = (key, val) => {
      const arr = (this.state && this.state[key]) || [];
      const nextArr = arr.indexOf(val) >= 0 ? arr.filter((x) => x !== val) : arr.concat([val]);
      this.setState({ [key]: nextArr });
    };
    const mkOpts = (names, key, field, active) => names.map((label) => {
      const on = active.indexOf(label) >= 0;
      return {
        label, on,
        n: all.filter((p) => p[field] === label).length,
        bd: on ? accent : t.border,
        bg: on ? accent : 'transparent',
        toggle: () => toggleIn(key, label),
      };
    });
    const catOpts = mkOpts(['Ultraligeras', 'Gaming', 'Creadores', 'Oficina'], 'cats', 'cat', cats);
    const brandOpts = mkOpts(['Nordic', 'Kite', 'Volt', 'Aether'], 'brands', 'brand', brands);
    const ratingOpts = [4.5, 4.0, 3.5].map((v) => ({
      label: v.toFixed(1) + ' o más',
      on: minR === v,
      bd: minR === v ? accent : t.border,
      set: () => this.setState({ minR: minR === v ? 0 : v }),
    }));

    const chips = [];
    cats.forEach((c) => chips.push({ label: c, remove: () => toggleIn('cats', c) }));
    brands.forEach((b) => chips.push({ label: b, remove: () => toggleIn('brands', b) }));
    if (minR) chips.push({ label: '≥ ' + minR.toFixed(1), remove: () => this.setState({ minR: 0 }) });
    if (stock) chips.push({ label: 'Con stock', remove: () => this.setState({ stock: false }) });

    return {
      t, dark, light: !dark, accent,
      count: filtered.length, results, empty: filtered.length === 0,
      catOpts, brandOpts, ratingOpts,
      chips, hasChips: chips.length > 0, chipCount: chips.length,
      sheet: !!st.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      toggleStock: () => this.setState({ stock: !stock }),
      stockBg: stock ? accent : t.border,
      stockX: stock ? '20px' : '2px',
      clear: () => this.setState({ cats: [], brands: [], minR: 0, stock: false }),
    };
  }
}
</script>
</body>
</html>
