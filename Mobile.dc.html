<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .mono { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; }
    .pill { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 8px 0 20px; border-radius: 999px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
    .icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; cursor: pointer; }
    .bento { border-radius: 22px; }
    .reveal { animation: fadeUp .55s cubic-bezier(.22,1,.36,1) both; }
    .slides { display: flex; transition: transform .55s cubic-bezier(.22,1,.36,1); }
    .slide { min-width: 100%; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; padding: 14px; background: {{t.page}}; font-family: 'Geist', system-ui, sans-serif;">
  <div class="reveal" style="border-radius: 26px; padding: 12px; background: {{t.shell}}; border: 1px solid {{t.shellBorder}}; box-shadow: 0 30px 60px -30px rgba(30,40,80,0.3); backdrop-filter: blur(20px);">

    <!-- TOP BAR -->
    <header style="display: flex; align-items: center; gap: 10px; padding: 6px 6px 14px;">
      <span style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -0.03em; color: {{t.fg}};">
        <span style="display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: {{t.fg}}; color: {{t.shell}};">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </span>
        Tech<span style="color: {{accent}};">.</span>
      </span>
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 16px; border-radius: 999px; background: {{t.card}}; border: 1px solid {{t.cardBorder}};">
        <input type="search" placeholder="Buscar…" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: {{t.fg}}; font-size: 14px; font-family: inherit;">
        <span class="icon-btn" style="width: 32px; height: 32px; background: {{t.fg}}; color: {{t.shell}};">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
      </label>
      <button class="icon-btn" style="position: relative; background: {{t.fg}}; color: {{t.shell}};" aria-label="Carrito">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="mono" style="position: absolute; top: -2px; right: -2px; width: 16px; height: 16px; display: grid; place-items: center; font-size: 10px; font-weight: 600; border-radius: 999px; background: {{accent}}; color: #fff;">3</span>
      </button>
    </header>

    <div style="display: flex; flex-direction: column; gap: 12px;">

      <!-- HERO carousel -->
      <div style="position: relative; overflow: hidden; border-radius: 22px; background: {{t.hero}}; border: 1px solid {{t.cardBorder}};">
        <div class="slides" style="transform: {{offset}};">
          <sc-for list="{{slides}}" as="s" hint-placeholder-count="3">
            <div class="slide" style="padding: 22px 20px 18px;">
              <span style="display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 999px; background: {{t.card}}; border: 1px solid {{t.cardBorder}}; font-size: 11px; font-weight: 600; color: {{t.mutedFg}};">
                <span style="width: 5px; height: 5px; border-radius: 999px; background: {{accent}};"></span>{{s.tag}}
              </span>
              <h1 style="margin: 14px 0 0; font-size: 34px; line-height: 1.05; letter-spacing: -0.04em; font-weight: 600; color: {{t.fg}}; text-wrap: balance;">{{s.n}}</h1>
              <div style="display: grid; place-items: center; padding: 8px 0 4px;">
                <sc-if value="{{s.isH}}" hint-placeholder-val="{{true}}">
                  <svg width="160" height="150" viewBox="0 0 200 190" fill="none">
                    <defs><linearGradient id="mh{{s.i}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{accent}}"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.55"/></linearGradient></defs>
                    <path d="M42 104 V92 a58 58 0 0 1 116 0 V104" stroke="url(#mh{{s.i}})" stroke-width="12" stroke-linecap="round"/>
                    <rect x="30" y="100" width="26" height="50" rx="13" fill="url(#mh{{s.i}})"/>
                    <rect x="144" y="100" width="26" height="50" rx="13" fill="url(#mh{{s.i}})"/>
                    <circle cx="150" cy="44" r="4" fill="{{accent}}"/>
                  </svg>
                </sc-if>
                <sc-if value="{{s.isL}}" hint-placeholder-val="{{false}}">
                  <svg width="170" height="150" viewBox="0 0 210 190" fill="none">
                    <defs><linearGradient id="ml{{s.i}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{accent}}"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.5"/></linearGradient></defs>
                    <rect x="44" y="44" width="122" height="78" rx="8" fill="url(#ml{{s.i}})"/>
                    <rect x="56" y="56" width="66" height="8" rx="4" fill="#fff" opacity="0.8"/>
                    <path d="M30 146 L180 146 L167 124 L43 124 Z" fill="{{t.fg}}" opacity="0.12"/>
                  </svg>
                </sc-if>
                <sc-if value="{{s.isM}}" hint-placeholder-val="{{false}}">
                  <svg width="170" height="150" viewBox="0 0 210 190" fill="none">
                    <defs><linearGradient id="mm{{s.i}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{accent}}"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.5"/></linearGradient></defs>
                    <rect x="42" y="40" width="126" height="80" rx="9" fill="url(#mm{{s.i}})"/>
                    <rect x="56" y="52" width="54" height="8" rx="4" fill="#fff" opacity="0.8"/>
                    <rect x="92" y="120" width="26" height="18" rx="3" fill="{{t.fg}}" opacity="0.2"/>
                    <rect x="74" y="138" width="62" height="6" rx="3" fill="{{t.fg}}" opacity="0.3"/>
                  </svg>
                </sc-if>
              </div>
              <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px;">
                <span class="mono" style="font-size: 18px; color: {{t.mutedFg}};">{{s.idx}}</span>
                <span style="flex: 1; font-size: 12px; line-height: 1.45; color: {{t.mutedFg}};">{{s.line}}</span>
              </div>
              <button class="pill" style="width: 100%; margin-top: 16px; background: {{accent}}; color: #fff;">
                {{s.cta}}
                <span style="display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; background: rgba(255,255,255,0.22);">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
                </span>
              </button>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: center; gap: 6px; padding: 0 0 12px;">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
            <button onClick="{{d.go}}" style="width: {{d.w}}; height: 7px; border-radius: 999px; border: none; cursor: pointer; background: {{d.bg}};" aria-label="Cambiar oferta"></button>
          </sc-for>
        </div>
      </div>

      <!-- COLORES -->
      <div class="bento" style="padding: 18px 20px; background: {{t.card}}; border: 1px solid {{t.cardBorder}};">
        <p style="margin: 0 0 12px; font-size: 13px; font-weight: 600; color: {{t.fg}};">Colores populares</p>
        <div style="display: flex; gap: 12px;">
          <span style="width: 30px; height: 30px; border-radius: 999px; background: oklch(0.55 0.2 264); box-shadow: 0 0 0 3px {{t.card}}, 0 0 0 4px oklch(0.55 0.2 264);"></span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: oklch(0.72 0.17 60);"></span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: oklch(0.65 0.19 150);"></span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: oklch(0.6 0.22 20);"></span>
          <span style="width: 30px; height: 30px; border-radius: 999px; background: oklch(0.78 0.13 195);"></span>
        </div>
      </div>

      <!-- 2-UP -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="bento" style="position: relative; padding: 16px 18px; background: {{t.card}}; border: 1px solid {{t.cardBorder}}; overflow: hidden;">
          <p style="margin: 0; font-size: 12px; font-weight: 600; line-height: 1.3; color: {{t.fg}};">Nueva gen<br>X-Bud Pro</p>
          <svg width="100%" height="72" viewBox="0 0 150 72" fill="none" style="margin-top: 6px;">
            <defs><linearGradient id="me" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{accent}}"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.5"/></linearGradient></defs>
            <path d="M56 16 q-3 -10 9 -10 q12 0 9 15 l-3 15 q-1 9 -10 9 q-10 0 -10 -12 z" fill="url(#me)"/>
            <path d="M94 16 q3 -10 -9 -10 q-12 0 -9 15 l3 15 q1 9 10 9 q10 0 10 -12 z" fill="url(#me)"/>
          </svg>
        </div>
        <div class="bento" style="position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 18px; background: {{t.hero}}; border: 1px solid {{t.cardBorder}}; overflow: hidden;">
          <svg width="100%" height="72" viewBox="0 0 150 72" fill="none">
            <path d="M42 44 V38 a33 33 0 0 1 66 0 V44" stroke="{{t.fg}}" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
            <rect x="32" y="40" width="18" height="30" rx="9" fill="{{t.fg}}" opacity="0.12" stroke="{{t.fg}}" stroke-opacity="0.5" stroke-width="1.5"/>
            <rect x="100" y="40" width="18" height="30" rx="9" fill="{{t.fg}}" opacity="0.12" stroke="{{t.fg}}" stroke-opacity="0.5" stroke-width="1.5"/>
          </svg>
          <p style="margin: 6px 0 0; font-size: 12px; font-weight: 600; color: {{t.fg}};">Surface · graves</p>
        </div>
      </div>

      <!-- MÁS PRODUCTOS -->
      <div class="bento" style="padding: 16px 18px; background: {{t.card}}; border: 1px solid {{t.cardBorder}};">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div><p style="margin: 0; font-size: 13px; font-weight: 600; color: {{t.fg}};">Más productos</p><p style="margin: 2px 0 0; font-size: 12px; color: {{t.mutedFg}};">460 artículos</p></div>
          <a href="#" style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; background: {{t.hero}}; color: {{t.fg}};"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></a>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 12px;">
          <span style="flex: 1; aspect-ratio: 1; border-radius: 12px; background: {{t.hero}}; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></span>
          <span style="flex: 1; aspect-ratio: 1; border-radius: 12px; background: {{t.hero}}; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 14h10"/></svg></span>
          <span style="flex: 1; aspect-ratio: 1; border-radius: 12px; background: {{t.hero}}; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg></span>
        </div>
      </div>

      <!-- STATS -->
      <div class="bento" style="display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: {{accent}}; color: #fff;">
        <div style="display: flex;">
          <span style="width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.35); border: 2px solid {{accent}};"></span>
          <span style="width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.25); border: 2px solid {{accent}}; margin-left: -10px;"></span>
          <span style="width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.18); border: 2px solid {{accent}}; margin-left: -10px;"></span>
        </div>
        <div>
          <p class="mono" style="margin: 0; font-size: 20px; font-weight: 600;">5 M+</p>
          <p style="margin: 2px 0 0; font-size: 12px; opacity: 0.85; display: flex; align-items: center; gap: 4px;">descargas · <span class="mono">[4,6]</span><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.9 21l1.2-6.8-5-4.9 6.9-1z"/></svg></p>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <footer style="display: flex; flex-direction: column; gap: 8px; padding: 16px 6px 6px; font-size: 12px; color: {{t.mutedFg}};">
      <div style="display: flex; gap: 16px;"><a href="#">Tienda</a><a href="#">Soporte</a><a href="#">Envíos</a><a href="#">Privacidad</a></div>
      <span>© [AÑO] E-commerce Tech</span>
    </footer>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"accent":{"editor":"color","default":"#5b5bd6","options":["#5b5bd6","#2563eb","#7c3aed","#be123c"],"section":"Marca"},"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { slide: 0 }; }
  componentDidMount() {
    this._t = setInterval(() => this.setState((s) => ({ slide: (((s && s.slide) || 0) + 1) % 3 })), 6000);
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const accent = this.props.accent ?? '#5b5bd6';
    const light = {
      page: 'linear-gradient(160deg, oklch(0.92 0.025 250) 0%, oklch(0.95 0.01 210) 45%, oklch(0.95 0.03 95) 100%)',
      shell: 'oklch(0.99 0.003 250 / 0.75)', shellBorder: 'oklch(1 0 0 / 0.65)',
      card: 'oklch(1 0 0 / 0.62)', cardBorder: 'oklch(0.62 0.02 260 / 0.16)',
      hero: 'oklch(0.97 0.008 250 / 0.78)',
      fg: 'oklch(0.2 0.02 260)', mutedFg: 'oklch(0.5 0.02 260)',
    };
    const darkT = {
      page: 'linear-gradient(160deg, oklch(0.24 0.02 260) 0%, oklch(0.17 0.012 250) 50%, oklch(0.19 0.018 95) 100%)',
      shell: 'oklch(0.21 0.01 260 / 0.7)', shellBorder: 'oklch(1 0 0 / 0.1)',
      card: 'oklch(1 0 0 / 0.06)', cardBorder: 'oklch(1 0 0 / 0.12)',
      hero: 'oklch(1 0 0 / 0.04)',
      fg: 'oklch(0.97 0 0)', mutedFg: 'oklch(0.72 0.02 260)',
    };
    const t = dark ? darkT : light;
    const base = [
      { idx: '01', tag: 'Auriculares', n: 'Sonido que inspira', line: 'Cancelación activa, 40 h de batería.', cta: 'Ver auriculares', kind: 'h' },
      { idx: '02', tag: 'Portátiles', n: 'Potencia sin cables', line: 'UltraBook 14”: Core i7, ligera.', cta: 'Ver portátiles', kind: 'l' },
      { idx: '03', tag: 'Setup', n: 'Tu espacio, listo', line: 'Monitores, teclados y más.', cta: 'Ver setup', kind: 'm' },
    ];
    const n = base.length;
    const cur = (this.state && this.state.slide) || 0;
    const slide = ((cur % n) + n) % n;
    const slides = base.map((s, i) => ({ ...s, i, isH: s.kind === 'h', isL: s.kind === 'l', isM: s.kind === 'm' }));
    const offset = 'translateX(-' + (slide * 100) + '%)';
    const dots = base.map((s, idx) => ({
      w: idx === slide ? '22px' : '7px',
      bg: idx === slide ? accent : t.cardBorder,
      go: () => this.setState({ slide: idx }),
    }));
    return { t, dark, accent, slides, offset, dots };
  }
}
</script>
</body>
</html>
